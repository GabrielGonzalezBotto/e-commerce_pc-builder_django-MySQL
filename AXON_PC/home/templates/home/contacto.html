{% extends 'base.html' %}
{% load static %}

{% block title %}Axon PC - Contatco{% endblock %}

{% block content %}
    <div class="contacto">

        <div class="box-info">
            <h2 class="text-dark">CONTACTATE <br> CON <br> NOSOTROS</h2>
            <div class="data">
                <p><i class="fa-solid fa-phone"></i>+54 9 362 4595558</p>
                <p><i class="fa-solid fa-envelope"></i>gabrielgonzalezbotto@gmail.com</p>
                <p><i class="fa-solid fa-location-dot"></i>AV.Simepre viva 989, Resistencia, Chaco</p>
            </div>

            <div class="links-info">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-github"></i></a>
                <a href="#"><i class="fa-brands fa-linkedin"></i></a>
                <a href="#"><i class="fa-brands fa-discord"></i></a>
            </div>
        </div>

        <form class="form-contacto" action="#">
            <div class="input-box">
                <input type="text" required placeholder="Nombre y Apellido...">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="input-box">
                <input type="email" required placeholder="Correo electrónico">
                <i class="fa-solid fa-envelope"></i>
            </div>
            <div class="input-box">
                <input type="text" required placeholder="Asunto">
                <i class="fa-solid fa-pencil"></i>
            </div>
            <div class="input-box">
                <textarea cols="30" rows="10" placeholder="Ecribí tu mensaje, queremos ayuderte..."></textarea>
            </div>
            <button type="submit">Enviar mensaje</button>
        </form>
    </div>
{% endblock %}
