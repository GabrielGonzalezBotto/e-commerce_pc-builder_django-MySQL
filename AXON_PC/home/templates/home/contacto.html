<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Axon PC{% endblock %}</title>
    <!-- Bootstrap 5 CSS para el diseño Responsive -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Tus estilos personalizados (opcional) -->
    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- NAVBAR RESPONSIVE -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="{% url 'home' %}">AXON PC</a>
            <!-- Botón para celulares (Menú Hamburguesa) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Enlaces de la Navbar -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'home' %}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Armar PC</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Componentes</a>
                    </li>
                    <!-- Botón destacado para el Panel Interno/CRM -->
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-outline-info btn-sm w-100 mt-2 mt-lg-0" href="#">Panel Gestión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO DINÁMICO (Cambia en cada página) -->
    <main class="flex-grow-1 container my-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER RESPONSIVE -->
    <footer class="bg-dark text-light py-3 mt-auto border-top border-secondary">
        <div class="container text-center">
            <p class="mb-1">&copy; 2026 Axon PC - Todos los derechos reservados.</p>
            <small class="text-muted">Desarrollado por Gabriel Gonzalez Botto</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JavaScript (Necesario para que funcione el menú en celulares) -->
    <script src="https://jsdelivr.net"></script>
    <!-- Tus scripts personalizados (opcional) -->
    {% block extra_js %}{% endblock %}
</body>
</html>
