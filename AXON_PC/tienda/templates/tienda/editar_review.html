{% extends 'base.html' %}
{% load static %}

{% block title %}Axon PC - Editar Opinión{% endblock %}

{% block content %}
<div class="producto">
    <div class="producto-reviews bg-body bg-text">

        <h2>Editar tu opinión para: <sapn style="color: var(--color-acento);">{{ producto.nombre }}</sapn></h2>
        <div class="title-line"></div>

        <form action="{% url 'editar_review' review.id %}" method="POST" class="review-form bg-body bg-text" style="margin-top: 20px;">
            {% csrf_token %}

            <label for="stars">
                <div class="review-stars">
                    <h4>¿Cuántas estrellas tiene este producto, según tu criterio?</h4>
                    <span class="star-select" data-value="1"><i class="fa-solid fa-star"></i></span>
                    <span class="star-select" data-value="2"><i class="fa-solid fa-star"></i></span>
                    <span class="star-select" data-value="3"><i class="fa-solid fa-star"></i></span>
                    <span class="star-select" data-value="4"><i class="fa-solid fa-star"></i></span>
                    <span class="star-select" data-value="5"><i class="fa-solid fa-star"></i></span>
                    <input type="hidden" name="stars" id="stars_input" value="5"> 
                </div>
            </label>

            <label for="comentario" style="display: block; margin-bottom: 8px; font-weight: bold;">Tu comentario:</label>
            <textarea name="comentario" id="comentario" rows="5" required style="width: 100%; padding: 15px; border-radius: 4px; margin-bottom: 20px;">{{ review.comentario }}</textarea>

            <div style="display: flex; gap: 10px;">
                <button class="btn-submit-review" style="background-color: var(--color-acento);">Guardar Cambios</button>
                <a href="{% url 'producto' producto.id %}" style="display: inline-block; padding: 12px 20px; background-color: #7f8c8d; color: aliceblue; text-decoration: none; border-radius: 4px; text-align: center;">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
